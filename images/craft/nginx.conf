# Static server for the craft apps (S279, S249). No upstreams, no
# server-side code, runs as the non-root nginx user on 8080. All runtime
# writes go under /tmp. Shared rules live here; per-app differences are
# recorded in docs/architecture/CRAFT_HEADER_TABLE.md.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The build precompresses text and wasm assets (name.ext.gz); the
    # dynamic gzip below covers anything it missed. WebAssembly is large
    # (tens of MB) and compresses to about a third.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/wasm text/javascript application/javascript text/css
        application/json image/svg+xml image/x-icon text/plain;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # add_header in a location replaces every inherited add_header, so
        # each location repeats X-Content-Type-Options itself.

        # Liveness for the container healthcheck.
        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 200 "ok\n";
        }

        # The HTML entry and anything unhashed revalidates on every load.
        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri $uri/ =404;
        }

        # Content-hashed assets never change: the hash is a run of 8+ hex
        # digits set off by '.', '-' or '_' before the extension, with an
        # optional wasm-bindgen "_bg" suffix (name.<hex>.js,
        # name-<hex>.js, name-<hex>_bg.wasm).
        location ~* "[-._][0-9a-f]{8,}(_bg)?\.(js|mjs|css|wasm|woff2?|ttf|png|jpe?g|gif|svg|webp|ico)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # WebAssembly must be served with its own type for streaming
        # compilation; an unhashed one revalidates.
        location ~* \.wasm$ {
            types { }
            default_type application/wasm;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
    }
}
