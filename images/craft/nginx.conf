# Static server for the craft apps (S279). No upstreams, no server-side
# code. All runtime writes go under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # The HTML entry and anything unhashed revalidates on every load.
        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ =404;
        }

        # Content-hashed assets (name.<8+ hex>.ext) never change.
        location ~* "\.[0-9a-f]{8,}\.(js|mjs|css|wasm|woff2?|ttf|png|jpe?g|gif|svg|webp|ico)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # WebAssembly must be served with its own type for streaming
        # compilation.
        location ~* \.wasm$ {
            types { }
            default_type application/wasm;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
    }
}
