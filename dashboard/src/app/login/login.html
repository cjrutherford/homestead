<section aria-label="Log in">
  <h2>Log in</h2>

  @if (sessionsState.isLoggedIn()) {
    <p>
      Already logged in as {{ sessionsState.username() }}. Continue on the
      <a routerLink="/status">status page</a>.
    </p>
  } @else {
    @if (error()) {
      <app-state-message kind="error" [headline]="error()" />
    }
    <form
      (submit)="submit(nameInput.value, passwordInput.value); $event.preventDefault()"
      aria-label="Login"
    >
      <label>
        Username
        <input #nameInput name="username" autocomplete="username" [disabled]="busy()" />
      </label>
      <label>
        Password
        <input
          #passwordInput
          name="password"
          type="password"
          autocomplete="current-password"
          [disabled]="busy()"
        />
      </label>
      <button type="submit" [disabled]="busy()">Log in</button>
    </form>
  }
</section>
