<header class="shell-header">
  <p class="brand">Homestead</p>
  <nav aria-label="Primary">
    <a routerLink="/status" routerLinkActive="active" ariaCurrentWhenActive="page">
      Status
    </a>
    <a routerLink="/claim" routerLinkActive="active" ariaCurrentWhenActive="page">
      Claim
    </a>
    @if (sessions.isLoggedIn()) {
      <span class="username">{{ sessions.username() }}</span>
      <button type="button" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">
        Log in
      </a>
    }
    <!-- Configuration (S035) pages add their nav links here in their own slice. -->
  </nav>
</header>

<main class="shell-main">
  <router-outlet />
</main>
