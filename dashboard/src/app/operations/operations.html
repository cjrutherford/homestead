<section aria-label="Operations">
  <h1>Operations</h1>

  @if (error()) {
    <app-state-message kind="error" [headline]="error()" actionLabel="Try again" (action)="load()" />
  } @else {
    <app-loading [loading]="operations() === null" shape="list">
      @if (operations()?.length === 0) {
        <app-state-message
          kind="empty"
          headline="No operations yet."
          detail="Deploying, installing or updating something starts one. Progress shows here and in the work orders panel."
          actionLabel="Browse the catalog"
          actionLink="/catalog"
        />
      } @else {
        <div class="table-scroll">
          <table>
            <caption class="visually-hidden">Operations, newest first unless sorted</caption>
            <thead>
              <tr>
                <th scope="col" [attr.aria-sort]="ariaFor('type')">
                  <button type="button" class="sort" [attr.data-dir]="dirFor('type')" (click)="sortBy('type')">Operation</button>
                </th>
                <th scope="col" [attr.aria-sort]="ariaFor('status')">
                  <button type="button" class="sort" [attr.data-dir]="dirFor('status')" (click)="sortBy('status')">Result</button>
                </th>
                <th scope="col" class="num">Steps</th>
                <th scope="col" [attr.aria-sort]="ariaFor('created')">
                  <button type="button" class="sort" [attr.data-dir]="dirFor('created')" (click)="sortBy('created')">Started</button>
                </th>
              </tr>
            </thead>
            <tbody>
              @for (op of rows(); track op.id) {
                <tr>
                  <td><a [routerLink]="['/operations', op.id]">{{ labelOf(op.type) }}</a></td>
                  <td><span class="badge" [class]="badgeOf(op.status)">{{ wordOf(op.status) }}</span></td>
                  <td class="num">{{ stepsOf(op) }}</td>
                  <td>@if (op.created_at) { <time [attr.datetime]="op.created_at">{{ op.created_at | when }}</time> }</td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      }
    </app-loading>
  }
</section>
