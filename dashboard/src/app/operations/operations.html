<section aria-label="Operations">
  <h1>Operations</h1>

  @if (error()) {
    <app-state-message kind="error" [headline]="error()" actionLabel="Try again" (action)="load()" />
  } @else {
    <app-loading [loading]="operations() === null" shape="list">
      @if (operations()?.length === 0) {
        <app-state-message
          kind="empty"
          headline="No operations yet."
          detail="Deploying, installing or updating something starts one. Progress shows here and in the work orders panel."
          actionLabel="Browse the catalog"
          actionLink="/catalog"
        />
      } @else {
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">Operation</th>
                <th scope="col">Result</th>
              </tr>
            </thead>
            <tbody>
              @for (op of operations() ?? []; track op.id) {
                <tr>
                  <td><a [routerLink]="['/operations', op.id]">{{ labelOf(op.type) }}</a></td>
                  <td><span class="badge" [class]="badgeOf(op.status)">{{ wordOf(op.status) }}</span></td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      }
    </app-loading>
  }
</section>
