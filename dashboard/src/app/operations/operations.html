<section aria-label="Operations">
  <h1>Operations</h1>

  @if (error()) {
    <app-state-message kind="error" [headline]="error()" />
  } @else if (operations() === null) {
    <app-state-message kind="loading" headline="Loading…" />
  } @else if (operations()?.length === 0) {
    <app-state-message kind="empty" headline="No operations yet." />
  } @else {
    <ul>
      @for (op of operations() ?? []; track op.id) {
        <li>
          <a [routerLink]="['/operations', op.id]">{{ op.type }}</a>
          — {{ op.status }}
        </li>
      }
    </ul>
  }
</section>
