# Immich photos (S171): the third curated app package.
# Curated first-party manifest — versions pin here, updates bump this file.
# Image tags follow the official v3.3.0 compose (server, learning,
# valkey, vector postgres); digests stay out because multi-arch digests
# differ per platform while tags resolve correctly everywhere.
# Secrets (S266): the database password is generated into the secret
# store at install and delivered as a 0600 file through Compose secrets
# (ADR-021). Immich reads DB_PASSWORD_FILE and postgres POSTGRES_PASSWORD_FILE;
# hostnames and names are plain environment, so a fresh install starts
# without manual configuration.
name: immich
version: 3.3.0
title: Immich
blurb: Photos and videos you host.
description: Immich backs up phone photos and videos with machine-learning
  search, shared albums, and memories — all on the home appliance.
  The library lives on bulk storage; services stay small and backed up.
category: media
icon: mdi:image-multiple
services:
- name: server
  image: ghcr.io/immich-app/immich-server:v3.3.0
  exposes: web
  environment:
    DB_HOSTNAME: database
    DB_USERNAME: immich
    DB_DATABASE_NAME: immich
    REDIS_HOSTNAME: cache
  # Image VOLUME: /data (uploads, thumbnails, encoded video). The
  # official image runs as root (upstream compose sets no user), so
  # ownership stays untouched.
  data:
  - target: /data
    class: bulk
    subpath: library
- name: machine-learning
  image: ghcr.io/immich-app/immich-machine-learning:v3.3.0
  exposes: ""
  # Downloaded models; persisted so restarts do not re-download. Runs
  # as root like the server image.
  data:
  - target: /cache
    class: bulk
    subpath: model-cache
- name: database
  image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
  exposes: ""
  environment:
    POSTGRES_USER: immich
    POSTGRES_DB: immich
    POSTGRES_INITDB_ARGS: --data-checksums
  # Image VOLUME: /var/lib/postgresql/data (postgres uid 999, 0700).
  data:
  - target: /var/lib/postgresql/data
    class: application
    subpath: database
    database: true
    mode: "0700"
    uid: 999
    gid: 999
- name: cache
  image: valkey/valkey:9
  exposes: ""
  # No image VOLUME (verified by inspection); /data is the queue and cache dir. Immich rebuilds
  # both on start (the official compose persists nothing here).
  data:
  - target: /data
    ephemeral: true
    sizemb: 256
    reason: Queue and cache state Immich rebuilds on start; nothing to back up.
# Immich cannot run under a path (ADR-044): it keeps a name of its own,
# immich.lan and immich.local, and immich.<zone> when published.
serve: host
requirements:
  memorymb: 4096
  cpucount: 2
  architectures: [amd64, arm64]
  storage:
  - class: application
    minbytes: 5368709120
  - class: bulk
    minbytes: 107374182400
  ports: [2283]
exposure:
  package: immich
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: true
    warnings:
    - Photo libraries leave the LAN when widened; share deliberately.
backuppaths:
- config
sso:
  class: optional
  protocols: [oidc]
  # App sign-in through Authentik (S298): Immich's built-in OAuth.
  oidc:
    adapter: immich
    service: server
database:
  service: database
  kind: postgres
  database: immich
  username: immich
  passwordsecret: db_password
secrets:
- name: db_password
  consumers:
  - service: database
    env: POSTGRES_PASSWORD_FILE
  - service: server
    env: DB_PASSWORD_FILE
- name: admin_password
  # The first-run administrator's password (S318). Homestead holds it and
  # uses it once, to create the administrator; no container reads it.
  # Immich keeps its own copy, so rotating it would leave the shown value
  # wrong: change the password in Immich instead.
  immutable: true
  reveal: true
  note: Password for the Immich administrator account "admin@homestead.lan", created by Homestead when Immich first started. People sign in with Authentik; this account is for emergencies.
# Immich cannot set itself up from its environment, and until it has an
# administrator its web app shows "create an administrator" to everyone,
# even with sign-in through Authentik on. Homestead creates the
# administrator through Immich's API at the end of install, and again
# before sign-in is applied if that failed (S318).
firstrun:
  routine: immich
  service: server
  account: admin@homestead.lan
  secret: admin_password
