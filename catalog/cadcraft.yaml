# CADCraft (S253): a static craft package on the S249 shared shape
# (docs/architecture/STATIC_CRAFT_PACKAGES.md). The image is built on the
# appliance by the signed, verify-then-build craft operation (ADR-028); it
# is never pulled, so there is no registry reference and no catalog digest.
# The version below is the vendored storytold release and must equal the
# image tag and the version in catalog/craft/craft-manifest.yaml.
name: cadcraft
publish: never  # ADR-061
version: 0.7.0
title: CADCraft
blurb: Computer-aided design drafting tool that runs in your browser.
description: CADCraft is a computer-aided design drafting application with a command line, object snaps, layers, dimensions, hatches, blocks and DXF drawings (upstream marks it as early development). It runs entirely in the browser from a small web server on your appliance, so there is nothing to install on your devices. Your drawings stay in your browser and export to your device; the app keeps nothing on the appliance, and only its preferences are remembered by the browser. It works best in a recent browser with WebGPU or WebGL2; the appliance cannot check this, so Homestead lists browser needs as advisories only. It is served over your local network.
category: productivity
icon: mdi:ruler-square
services:
- name: cadcraft
  image: homestead/craft-cadcraft:0.7.0
  exposes: web
  # The image declares no VOLUME. nginx runs as the unprivileged nginx
  # user and writes only under /tmp (pid file and temporary paths), so
  # /tmp is the whole writable surface.
  data:
  - target: /tmp
    ephemeral: true
    sizemb: 16
    reason: nginx pid file and request temporary files; nothing to keep or back up.
requirements:
  memorymb: 64
  cpucount: 1
  architectures: [amd64, arm64]
# Served at /apps/cadcraft/ under the appliance's own names (ADR-045). The
# app loads its assets by relative paths, so the edge strips the path;
# the wrapper page and file path under it come from the daemon.
serve: path
strip_prefix: true
exposure:
  package: cadcraft
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: false
    warnings:
    - CADCraft stores nothing on the appliance, so widening exposure would offer a public drafting tool whose drawings never reach your storage. With Nextcloud file storage linked, its document path (_homestead/files/) is forwarded to your appliance, which reads and writes your Nextcloud on the browser's behalf; it needs a Homestead operator session opened from the dashboard, but widening exposure puts the host, that path and your document transfers beyond the LAN. Keep it local.
browser:
- capability: webgpu
  reason: "CADCraft renders with WebGPU where the browser has it and falls back to WebGL2 on its own; ?webgl forces WebGL2 and ?cpu the slower CPU canvas."
- capability: webgl2
  reason: "If WebGPU is missing CADCraft uses WebGL2; a browser with neither gets an in-page message instead of the app."
- capability: secure-context
  reason: "WebGPU and the clipboard need a secure context (HTTPS); trust your Homestead root certificate on the device first."
- capability: clipboard
  reason: "Copy and paste with other applications uses the browser clipboard, which needs a secure context and the browser's permission."
- capability: browser-storage
  reason: "Preferences are kept in the browser's local storage, which the browser may clear; export drawings to your device to keep them."
sso:
  class: unsupported
