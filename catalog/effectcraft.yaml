# EffectCraft (S252): a static craft package on the S249 shared shape
# (docs/architecture/STATIC_CRAFT_PACKAGES.md). The image is built on the
# appliance by the signed, verify-then-build craft operation (ADR-028); it
# is never pulled, so there is no registry reference and no catalog digest.
# The version below is the vendored storytold release and must equal the
# image tag and the version in catalog/craft/craft-manifest.yaml.
name: effectcraft
version: 0.10.0
title: EffectCraft
blurb: Motion graphics and visual effects compositor that runs in your browser.
description: EffectCraft is a motion graphics and visual effects compositor with layers, keyframes, tracking, keying, audio effects and a render queue. It runs entirely in the browser from a small web server on your appliance, so there is nothing to install on your devices. Projects and imported media stay in your browser's storage and export to your device; the app keeps nothing on the appliance, and its service worker lets it start offline after the first visit. Large media is held by the browser, so heavy compositions need a device with plenty of memory. It needs a recent browser with WebGPU, WebCodecs and audio output; the appliance cannot check these, so Homestead lists them as advisories only. It is served over your local network.
category: productivity
icon: mdi:movie-open-star-outline
services:
- name: effectcraft
  image: homestead/craft-effectcraft:0.10.0
  exposes: web
  # The image declares no VOLUME. nginx runs as the unprivileged nginx
  # user and writes only under /tmp (pid file and temporary paths), so
  # /tmp is the whole writable surface.
  data:
  - target: /tmp
    ephemeral: true
    sizemb: 16
    reason: nginx pid file and request temporary files; nothing to keep or back up.
requirements:
  memorymb: 64
  cpucount: 1
  architectures: [amd64, arm64]
# Served at /apps/effectcraft/ under the appliance's own names (ADR-045). The
# app loads its assets by relative paths, so the edge strips the path;
# the wrapper page and file path under it come from the daemon.
serve: path
strip_prefix: true
exposure:
  package: effectcraft
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: false
    warnings:
    - EffectCraft stores nothing on the appliance, so widening exposure would offer a public compositor whose projects never reach your storage. With Nextcloud file storage linked, its document path (_homestead/files/) is forwarded to your appliance, which reads and writes your Nextcloud on the browser's behalf; it needs a Homestead operator session opened from the dashboard, but widening exposure puts the host, that path and your document transfers beyond the LAN. Keep it local.
browser:
- capability: webgpu
  reason: "Effects render on the GPU through WebGPU, in the page and in render workers; without it EffectCraft renders on the CPU instead."
- capability: webcodecs
  reason: "Video decoding and encoding use the browser's WebCodecs where it is available."
- capability: webaudio
  reason: "Audio preview runs through the browser's Web Audio engine, in an audio worklet where the browser supports one."
- capability: audio-output
  reason: "Preview sound needs a working audio output device on the machine running the browser, and the browser may require a click before it plays sound."
- capability: secure-context
  reason: "WebGPU, the offline service worker and the private file storage need a secure context (HTTPS); trust your Homestead root certificate on the device first."
- capability: browser-storage
  reason: "Projects and imported media are kept in the browser's private file storage, which the browser may clear."
sso:
  class: unsupported
