# Navidrome music server (S354): the second Wave 2 package.
# Curated first-party manifest — versions pin here, updates bump this file.
# One Docker Hub container. Navidrome has no OIDC/SAML/LDAP; local accounts
# are the documented exception, and the first visit creates the admin user.
# Navidrome's proxy (external) auth reads a username header from a trusted
# source. S418 (ADR-055) turns that on: `apps sign-in apply navidrome` gates
# the site behind Authentik forward-auth at the edge, sets
# ND_EXTAUTH_USERHEADER to the header the outpost supplies, and trusts only
# the edge network (ND_EXTAUTH_TRUSTEDSOURCES). /rest/* (Subsonic clients)
# and /share/* (share links) bypass the gate and keep Navidrome's own
# credentials or links. Navidrome admins stay a Navidrome setting: only the
# first proxy user becomes admin, so the plan refuses until an admin exists.
# The JWT secrets are generated into the SQLite database on first start and
# backed up with it, so no secret is declared and the entrypoint is
# unchanged.
name: navidrome
version: 0.64.2
title: Navidrome
blurb: Your music library, streamed anywhere.
description: Navidrome streams your music collection with Subsonic-compatible
  apps and a browser player, keeping playlists and play counts in one SQLite
  database. It reads the music folder you already keep — the same directory
  Jellyfin can mount — and writes artwork and transcode caches to bulk
  storage.
category: music
icon: mdi:music
services:
- name: navidrome
  image: docker.io/navidrome/navidrome:0.64.2
  publisher: upstream
  exposes: web
  containerport: 4533
  environment:
    # Artwork and transcode caches are regenerable and can grow with the
    # library, so they live on bulk storage instead of the backed-up data
    # volume. The music and data folders keep the image defaults.
    ND_CACHEFOLDER: /cache
  # Image VOLUMEs: /data and /music. /data (SQLite database, playlists,
  # play counts) is application storage; /cache is the artwork and
  # transcode cache on bulk. /music is an owner volume: the read-only bulk
  # directory shared with Jellyfin, added at install, never declared, so
  # the library never rides in a backup.
  data:
  - target: /data
    class: application
    subpath: data
  - target: /cache
    class: bulk
    subpath: cache
requirements:
  memorymb: 256
  cpucount: 1
  architectures: [amd64, arm64]
  storage:
  - class: application
    minbytes: 2147483648
  - class: bulk
    minbytes: 10737418240
  # Navidrome listens on 4533; routes proxy to it and no host port is
  # published by default.
exposure:
  package: navidrome
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: true
    warnings:
    - Music libraries, playlists, and listening history leave the LAN when widened; expose only behind HTTPS with a certificate you trust.
backuppaths:
- data
database:
  service: navidrome
  kind: sqlite
  path: data/navidrome.db
sso:
  class: unsupported
  forwardauth:
    service: navidrome
    userheader: X-Authentik-Username
    copyheaders: [X-Authentik-Username]
    bypass:
    - path: ^/rest/.*
      reason: The Subsonic API. Native music apps cannot do a browser sign-in, so
        it keeps Navidrome's own user and app password. The identity header is
        stripped here, so it can only authenticate with those credentials.
    - path: ^/share/.*
      reason: Share links the owner made on purpose (page, audio stream, cover
        art, download). Each id is an unguessable link the owner can delete, and
        it serves only the shared items. The identity header is stripped here.
    - path: ^/app/(assets|static)/.*
      reason: The web player's own script and style files, which a share page
        loads. They hold no user data.
    env:
      ND_EXTAUTH_USERHEADER: "{{user_header}}"
      ND_EXTAUTH_TRUSTEDSOURCES: "{{edge_source}}"
    admin: local
    accountsfrom: navidrome-sqlite
    warnings:
    - Navidrome's administrator is chosen inside Navidrome, not from Authentik. Create the administrator in Navidrome first; people who sign in through Authentik get ordinary accounts.
    - Subsonic apps (phones, desktop players) sign in with a Navidrome username and an app password set inside Navidrome. They do not use Authentik.
integrations:
- kind: library
  target: jellyfin
  note: Mount the same bulk music directory into Navidrome and Jellyfin; Navidrome reads it.
