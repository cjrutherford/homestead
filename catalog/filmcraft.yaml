# FilmCraft (S252): a static craft package on the S249 shared shape
# (docs/architecture/STATIC_CRAFT_PACKAGES.md). The image is built on the
# appliance by the signed, verify-then-build craft operation (ADR-028); it
# is never pulled, so there is no registry reference and no catalog digest.
# The version below is the vendored storytold release and must equal the
# image tag and the version in catalog/craft/craft-manifest.yaml.
name: filmcraft
version: 0.8.0
title: FilmCraft
blurb: Video editor with a multi-track timeline that runs in your browser.
description: FilmCraft is a video editor with source and program monitors, a multi-track timeline, colour, effects and audio mixing. It runs entirely in the browser from a small web server on your appliance, so there is nothing to install on your devices. Your footage and projects stay in your browser (a recovery copy is kept in browser storage) and export to your device; the app keeps nothing on the appliance. Large media is held by the browser, so very long or high-resolution projects need a device with enough memory. It works best in a recent browser with WebCodecs, WebGPU and audio output; the appliance cannot check these, so Homestead lists them as advisories only. It is served over your local network.
category: productivity
icon: mdi:movie-edit-outline
services:
- name: filmcraft
  image: homestead/craft-filmcraft:0.8.0
  exposes: web
  # The image declares no VOLUME. nginx runs as the unprivileged nginx
  # user and writes only under /tmp (pid file and temporary paths), so
  # /tmp is the whole writable surface.
  data:
  - target: /tmp
    ephemeral: true
    sizemb: 16
    reason: nginx pid file and request temporary files; nothing to keep or back up.
requirements:
  memorymb: 64
  cpucount: 1
  architectures: [amd64, arm64]
exposure:
  package: filmcraft
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: false
    warnings:
    - FilmCraft stores nothing on the appliance, so widening exposure would offer a public video editor whose projects never reach your storage; keep it local until Nextcloud document storage lands.
browser:
- capability: webcodecs
  reason: "Hardware video decoding for H.264, HEVC, VP9 and AV1 uses the browser's WebCodecs; without it FilmCraft decodes with its own slower software decoders."
- capability: webgpu
  reason: "The fast GPU compositor needs WebGPU; without it FilmCraft falls back to WebGL2 and composites frames on the CPU, which is noticeably slower."
- capability: webaudio
  reason: "Audio playback and mixing run in a Web Audio worklet, which the browser must support."
- capability: audio-output
  reason: "Playback needs a working audio output device on the machine running the browser, and the browser may require a click before it plays sound."
- capability: secure-context
  reason: "WebGPU, the clipboard and browser storage only work over HTTPS; trust your Homestead root certificate on the device first."
- capability: browser-storage
  reason: "The crash-recovery copy and imported media are kept in the browser's private file storage, which the browser may clear."
sso:
  class: unsupported
