# DeckCraft (S250): a static craft package on the S249 shared shape
# (docs/architecture/STATIC_CRAFT_PACKAGES.md). The image is built on the
# appliance by the signed, verify-then-build craft operation (ADR-028); it
# is never pulled, so there is no registry reference and no catalog digest.
# The version below is the vendored storytold release and must equal the
# image tag and the version in catalog/craft/craft-manifest.yaml.
name: deckcraft
version: 0.7.0
title: DeckCraft
blurb: Presentation editor that runs in your browser.
description: DeckCraft is a presentation editor with slide layouts, themes, shapes, images, media and transitions that opens and saves presentation files. It runs entirely in the browser from a small web server on your appliance, so there is nothing to install on your devices. Decks stay in your browser and download to your device; the app keeps nothing on the appliance. It is served over your local network with a certificate from your Homestead internal CA.
category: productivity
icon: mdi:presentation
services:
- name: deckcraft
  image: homestead/craft-deckcraft:0.7.0
  exposes: web
  # The image declares no VOLUME. nginx runs as the unprivileged nginx
  # user and writes only under /tmp (pid file and temporary paths), so
  # /tmp is the whole writable surface.
  data:
  - target: /tmp
    ephemeral: true
    sizemb: 16
    reason: nginx pid file and request temporary files; nothing to keep or back up.
requirements:
  memorymb: 64
  cpucount: 1
  architectures: [amd64, arm64]
exposure:
  package: deckcraft
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: false
    warnings:
    - DeckCraft stores nothing on the appliance, so widening exposure would offer a public presentation editor whose decks never reach your storage; it has no Nextcloud file hook, so documents stay in each visitor's browser. Keep it local.
sso:
  class: unsupported
