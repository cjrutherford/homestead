# WordCraft word processor (S249): the first craft package, and the shape
# every static craft package reuses (docs/architecture/STATIC_CRAFT_PACKAGES.md).
# The image is built on the appliance by the signed, verify-then-build
# craft operation (ADR-028); it is never pulled, so there is no registry
# reference and no catalog digest. The version below is the vendored
# storytold release and must equal the image tag and the version in
# catalog/craft/manifest.unsigned.yaml.
name: wordcraft
version: 0.7.0
title: WordCraft
blurb: Word processor that runs in your browser.
description: WordCraft is a word processor with a ribbon, styles, tables,
  track changes and references that opens and saves .docx files. It runs
  entirely in the browser from a small web server on your appliance, so
  there is nothing to install on your devices. Documents stay in your
  browser and download to your device; the app keeps nothing on the
  appliance. It is served over your local network with a certificate from
  your Homestead internal CA.
category: productivity
icon: mdi:file-word-outline
services:
- name: wordcraft
  image: homestead/craft-wordcraft:0.7.0
  exposes: web
  # The image declares no VOLUME. nginx runs as the unprivileged nginx
  # user with a read-only-capable root and writes only under /tmp (pid
  # file and temporary paths), so /tmp is the whole writable surface.
  data:
  - target: /tmp
    ephemeral: true
    sizemb: 16
    reason: nginx pid file and request temporary files; nothing to keep or back up.
requirements:
  memorymb: 64
  cpucount: 1
  architectures: [amd64, arm64]
exposure:
  package: wordcraft
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: false
    warnings:
    - WordCraft stores nothing on the appliance, so widening exposure would offer a public editor whose documents never reach your storage; keep it local until Nextcloud document storage lands.
sso:
  class: unsupported
