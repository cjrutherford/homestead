# FigCraft (S251): a static craft package on the S249 shared shape
# (docs/architecture/STATIC_CRAFT_PACKAGES.md). The image is built on the
# appliance by the signed, verify-then-build craft operation (ADR-028); it
# is never pulled, so there is no registry reference and no catalog digest.
# The version below is the vendored storytold release and must equal the
# image tag and the version in catalog/craft/craft-manifest.yaml.
name: figcraft
publish: path  # ADR-062: public path behind the shared Authentik gate; the LAN stays open
version: 0.6.0
title: FigCraft
blurb: Interface design tool that runs in your browser.
description: FigCraft is an interface design tool for laying out screens, components and prototypes on an infinite canvas. It runs entirely in the browser from a small web server on your appliance, so there is nothing to install on your devices. Designs stay in your browser and download to your device; the app keeps nothing on the appliance. It needs a modern browser with WebGPU or WebGL2 and a secure context, which your Homestead internal CA certificate provides once your device trusts the root; without WebGPU it falls back to WebGL2 on its own. It is served over your local network.
category: productivity
icon: mdi:view-dashboard-outline
services:
- name: figcraft
  image: homestead/craft-figcraft:0.6.0
  exposes: web
  # The image declares no VOLUME. nginx runs as the unprivileged nginx
  # user and writes only under /tmp (pid file and temporary paths), so
  # /tmp is the whole writable surface.
  data:
  - target: /tmp
    ephemeral: true
    sizemb: 16
    reason: nginx pid file and request temporary files; nothing to keep or back up.
requirements:
  memorymb: 64
  cpucount: 1
  architectures: [amd64, arm64]
# Served at /apps/figcraft/ under the appliance's own names (ADR-045). The
# app loads its assets by relative paths, so the edge strips the path;
# the wrapper page and file path under it come from the daemon.
serve: path
strip_prefix: true
exposure:
  package: figcraft
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: true
    warnings:
    - FigCraft stores nothing on the appliance, so widening exposure would offer a public design tool whose designs never reach your storage; it has no Nextcloud file hook, so documents stay in each visitor's browser. Keep it local.
    - If you publish it, its public path sits behind the Authentik gate, so only people granted this app and the owner can open it. Your local address stays open (ADR-062).
sso:
  class: unsupported
  # ADR-062: the app has no sign-in of its own. Published, its path is behind
  # the shared Authentik gate on the tunnel entry only; the local names stay
  # open (ADR-045). No identity header is passed on and nothing bypasses.
  forwardauth:
    service: figcraft
