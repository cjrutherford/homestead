# Uptime Kuma monitor (S351): the last Wave 1 package.
# Curated first-party manifest — versions pin here, updates bump this file.
# It has no OIDC, so Homestead gates it at the edge with Authentik
# forward-auth for administrators only (S419, ADR-055). From S422 Kuma's
# own login is off behind the gate and the host block (disableAuth, set in
# its SQLite database by the pinned ownloginoff script), so the owner
# signs in once. It is the one package that is not allowed to
# widen: it holds monitor credentials and probes LAN addresses, so it
# recommends local and refuses public exposure outright. Homestead creates
# the administrator account (homestead-admin, a generated sealed revealable
# password) during install (S450, ADR-059), so Kuma's first-visit setup
# screen is never open; the sign-in step keeps that account and turns Kuma's
# own login off behind the gate. The image entrypoint sits before the Node
# process.
name: uptime-kuma
version: 2.5.7
title: Uptime Kuma
blurb: A quiet board that says whether everything is up.
description: Uptime Kuma checks web apps, containers, and addresses on a
  schedule and shows their history on one dashboard, with notifications
  when something stops answering. It is the appliance's own health board,
  so it stays on the local network and is never published as a public
  status page.
category: monitoring
icon: mdi:monitor-eye
services:
- name: uptime-kuma
  image: docker.io/louislam/uptime-kuma:2.5.7
  publisher: upstream
  exposes: web
  containerport: 3001
  # No environment overrides: the image sets UPTIME_KUMA_IS_CONTAINER and
  # listens on 3001. The administrator account is created by the install's
  # first run (the firstrun block below), never on the setup screen.
  # No image VOLUME. /app/data holds the SQLite database, uploaded
  # status-page assets, and monitor history; the image runs as root.
  data:
  - target: /app/data
    class: application
    subpath: data
requirements:
  memorymb: 1024
  cpucount: 1
  architectures: [amd64, arm64]
  storage:
  - class: application
    minbytes: 2147483648
  # Uptime Kuma listens on 3001; routes proxy to it and no host port is
  # published by default.
exposure:
  package: uptime-kuma
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: false
    warnings:
    - "Uptime Kuma must not become a public status page: it holds monitor credentials and probes LAN addresses. Keep it on the LAN or the overlay; public exposure is refused by design. With the Authentik gate on, status pages, badges and push URLs stay open to the local network by design; they are never open to the internet."
backuppaths:
- data
sso:
  class: unsupported
  forwardauth:
    service: uptime-kuma
    access: admin-only
    bypass:
    - path: ^/api/push/.*
      reason: Push monitors, called by cron jobs and other apps. The secret token in the URL is the credential and the endpoint only records a heartbeat.
    - path: ^/status/.*
      reason: Public status pages, which show only the monitors the owner put on a page. They were built to be anonymous and open to the local network only.
    - path: ^/api/status-page/.*
      reason: The JSON a status page loads (page data and heartbeats). It serves only what the owner chose to publish and changes no state.
    - path: ^/api/badge/.*
      reason: Status badges for the monitors on a status page. Read-only, anonymous by design.
    - path: ^/assets/.*
      reason: The web app's own script and style files, which a status page loads. They hold no user data.
    - path: ^/upload/.*
      reason: Logos and images the owner uploaded for status pages.
    - path: ^/icon\.svg$
      reason: The app icon a status page loads.
    ownloginoff:
      prepare:
      - node
      - -e
      - &kuma_signin_script |
        const VERIFIED = '2.5.7'
        const DIR = '/app/data'
        const PKG = '/app/package.json'
        const SQLITE = '/app/node_modules/@louislam/sqlite3'
        const fs = require('node:fs')
        const path = require('node:path')
        const die = (m) => {
          console.error('uptime-kuma sign-in: ' + m + " (Uptime Kuma's own database is written here; re-verify this script against its user and setting tables after any Kuma update)")
          process.exit(1)
        }
        const mode = process.argv[1]
        if (!['prepare', 'account', 'on', 'off'].includes(mode)) die('expected the argument prepare, account, on or off')
        const CFG = path.join(DIR, 'db-config.json')
        const DB = path.join(DIR, 'kuma.db')
        if (mode !== 'off') {
          let seen
          try { seen = JSON.parse(fs.readFileSync(PKG, 'utf8')).version } catch { die('cannot read the Uptime Kuma version') }
          if (seen !== VERIFIED) die('this is Uptime Kuma ' + seen + ' but the script was verified against ' + VERIFIED)
        }
        if (mode === 'prepare') {
          if (!fs.existsSync(CFG)) {
            fs.writeFileSync(CFG, JSON.stringify({ type: 'sqlite' }, null, 4), { mode: 0o600 })
            console.log('uptime-kuma sign-in: chose the built-in SQLite database')
            console.log('[restart]')
            process.exit(0)
          }
          let cfg
          try { cfg = JSON.parse(fs.readFileSync(CFG, 'utf8')) } catch { die('db-config.json cannot be read') }
          if (!cfg || cfg.type !== 'sqlite') die('Uptime Kuma uses the ' + (cfg && typeof cfg.type === 'string' ? cfg.type : 'unknown') + ' database; Homestead turns its login off only for the built-in SQLite database. Keep its own login on, or move it to SQLite first')
          console.log('uptime-kuma sign-in: SQLite database in use')
          process.exit(0)
        }
        if (!fs.existsSync(DB)) {
          if (mode === 'off') { console.log('uptime-kuma sign-in off (no database yet)'); process.exit(0) }
          die('the database is not there yet (the server is still starting)')
        }
        let who = null
        if (mode === 'on' || mode === 'account') {
          try { who = JSON.parse(fs.readFileSync(0, 'utf8')) } catch { die('expected the account as JSON on stdin') }
          if (!who || typeof who.username !== 'string' || who.username.length < 1 || who.username.length > 255 || typeof who.hash !== 'string' || !/^\$2[aby]\$10\$[./A-Za-z0-9]{53}$/.test(who.hash)) die('the account on stdin is not a username and a bcrypt hash')
        }
        const sqlite3 = require(SQLITE)
        const db = new sqlite3.Database(DB)
        const run = (q, p) => new Promise((res, rej) => db.run(q, p || [], (e) => (e ? rej(e) : res())))
        const all = (q, p) => new Promise((res, rej) => db.all(q, p || [], (e, rows) => (e ? rej(e) : res(rows))))
        const main = async () => {
          let open = false
          try {
            await run('PRAGMA busy_timeout = 30000')
            const want = { user: ['id', 'username', 'password', 'active'], setting: ['key', 'value', 'type'] }
            for (const t of Object.keys(want)) {
              const cols = (await all("SELECT name FROM pragma_table_info('" + t + "')")).map((c) => c.name)
              for (const c of want[t]) if (!cols.includes(c)) die('table ' + t + ' lacks column ' + c + ' (the server may still be creating its tables)')
            }
            await run('BEGIN IMMEDIATE')
            open = true
            const row = (await all("SELECT value FROM setting WHERE key = 'disableAuth'"))[0]
            const now = row && row.value === 'true'
            let changed = false
            if (mode === 'account') {
              const users = (await all('SELECT COUNT(*) AS n FROM user'))[0].n
              if (users === 0) await run('INSERT INTO user (username, password, active) VALUES (?, ?, 1)', [who.username, who.hash])
              console.log(users === 0 ? 'uptime-kuma account created' : 'uptime-kuma account exists')
            } else if (mode === 'on') {
              const users = (await all('SELECT COUNT(*) AS n FROM user'))[0].n
              if (users === 0) {
                await run('INSERT INTO user (username, password, active) VALUES (?, ?, 1)', [who.username, who.hash])
                changed = true
              }
              if (!row) { await run("INSERT INTO setting (key, value, type) VALUES ('disableAuth', 'true', 'general')"); changed = true }
              else if (!now) { await run("UPDATE setting SET value = 'true' WHERE key = 'disableAuth'"); changed = true }
              // Kuma sits behind the edge only: trust its forwarded-host and
              // forwarded-proto headers (Settings, Reverse Proxy, Trust Proxy),
              // read at start, so the restart below applies it.
              const tp = (await all("SELECT value FROM setting WHERE key = 'trustProxy'"))[0]
              if (!tp) { await run("INSERT INTO setting (key, value, type) VALUES ('trustProxy', 'true', 'general')"); changed = true }
              else if (tp.value !== 'true') { await run("UPDATE setting SET value = 'true' WHERE key = 'trustProxy'"); changed = true }
              console.log(changed ? 'uptime-kuma sign-in on' : 'uptime-kuma sign-in on (already on)')
            } else if (now) {
              await run("UPDATE setting SET value = 'false' WHERE key = 'disableAuth'")
              changed = true
              console.log('uptime-kuma sign-in off')
            } else {
              console.log('uptime-kuma sign-in off (already off)')
            }
            await run('COMMIT')
            open = false
            if (changed) console.log('[restart]')
          } catch (e) {
            if (open) { try { await run('ROLLBACK') } catch {} }
            die('the database access failed: ' + (e && e.code ? e.code : 'error'))
          }
          db.close()
        }
        main()
      - prepare
      account:
      - node
      - -e
      - *kuma_signin_script
      - account
      onapply:
      - node
      - -e
      - *kuma_signin_script
      - "on"
      onoff:
      - node
      - -e
      - *kuma_signin_script
      - "off"
    requireshostblock: true
    warnings:
    - Uptime Kuma's own login is turned off behind the Authentik gate, so you sign in once, to Authentik. Only administrators and the owner pass the gate, and Homestead keeps every other account on the host and every other container off Uptime Kuma's port. Turning sign-in off puts Kuma's own login back first.
    - Homestead created the Kuma account homestead-admin at install; its password is under Reveal on the app's page. To use Kuma's own login after sign-in is off, use that password, or set a new one with docker exec -it uptime-kuma-uptime-kuma npm run reset-password.
    - Turning sign-in on also sets Kuma's Trust Proxy setting, because only the edge can reach it.
    - Status pages, badges and push URLs stay open to the local network without Authentik. Uptime Kuma can never be published, so they are never open to the internet.
    - /metrics, /dashboard, /status-page and the live socket stay behind the gate.
firstrun:
  routine: uptime-kuma
  service: uptime-kuma
  account: homestead-admin
  secret: admin_password
secrets:
- name: admin_password
  immutable: true
  reveal: true
  note: Password for homestead-admin, the Uptime Kuma administrator Homestead created at install. With Authentik sign-in on, Kuma's own login is off and you sign in once, to Authentik.
