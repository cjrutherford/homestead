# Uptime Kuma monitor (S351): the last Wave 1 package.
# Curated first-party manifest — versions pin here, updates bump this file.
# It has no OIDC, so Homestead gates it at the edge with Authentik
# forward-auth for administrators only (S419, ADR-055); Kuma keeps its own
# login behind the gate. It is the one package that is not allowed to
# widen: it holds monitor credentials and probes LAN addresses, so it
# recommends local and refuses public exposure outright. The owner
# creates the administrator account in the app on first visit; no secret
# is declared and the image entrypoint sits before the Node process.
name: uptime-kuma
version: 2.5.7
title: Uptime Kuma
blurb: A quiet board that says whether everything is up.
description: Uptime Kuma checks web apps, containers, and addresses on a
  schedule and shows their history on one dashboard, with notifications
  when something stops answering. It is the appliance's own health board,
  so it stays on the local network and is never published as a public
  status page.
category: monitoring
icon: mdi:monitor-eye
services:
- name: uptime-kuma
  image: docker.io/louislam/uptime-kuma:2.5.7
  exposes: web
  containerport: 3001
  # No environment overrides: the image sets UPTIME_KUMA_IS_CONTAINER and
  # listens on 3001. The administrator account is created on first visit
  # (the application's own setup screen), so nothing is generated here.
  # No image VOLUME. /app/data holds the SQLite database, uploaded
  # status-page assets, and monitor history; the image runs as root.
  data:
  - target: /app/data
    class: application
    subpath: data
requirements:
  memorymb: 1024
  cpucount: 1
  architectures: [amd64, arm64]
  storage:
  - class: application
    minbytes: 2147483648
  # Uptime Kuma listens on 3001; routes proxy to it and no host port is
  # published by default.
exposure:
  package: uptime-kuma
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: false
    warnings:
    - "Uptime Kuma must not become a public status page: it holds monitor credentials and probes LAN addresses. Keep it on the LAN or the overlay; public exposure is refused by design. With the Authentik gate on, status pages, badges and push URLs stay open to the local network by design; they are never open to the internet."
backuppaths:
- data
sso:
  class: unsupported
  forwardauth:
    service: uptime-kuma
    access: admin-only
    bypass:
    - path: ^/api/push/.*
      reason: Push monitors, called by cron jobs and other apps. The secret token in the URL is the credential and the endpoint only records a heartbeat.
    - path: ^/status/.*
      reason: Public status pages, which show only the monitors the owner put on a page. They were built to be anonymous and open to the local network only.
    - path: ^/api/status-page/.*
      reason: The JSON a status page loads (page data and heartbeats). It serves only what the owner chose to publish and changes no state.
    - path: ^/api/badge/.*
      reason: Status badges for the monitors on a status page. Read-only, anonymous by design.
    - path: ^/assets/.*
      reason: The web app's own script and style files, which a status page loads. They hold no user data.
    - path: ^/upload/.*
      reason: Logos and images the owner uploaded for status pages.
    - path: ^/icon\.svg$
      reason: The app icon a status page loads.
    warnings:
    - Uptime Kuma keeps its own login behind the Authentik gate, so you sign in twice, to Authentik and then to Uptime Kuma. Only administrators and the owner pass the gate.
    - Status pages, badges and push URLs stay open to the local network without Authentik. Uptime Kuma can never be published, so they are never open to the internet.
    - /metrics, /dashboard, /status-page and the live socket stay behind the gate and Kuma's login.
