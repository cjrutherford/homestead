# DesignCraft (S253): a static craft package on the S249 shared shape
# (docs/architecture/STATIC_CRAFT_PACKAGES.md). The image is built on the
# appliance by the signed, verify-then-build craft operation (ADR-028); it
# is never pulled, so there is no registry reference and no catalog digest.
# The version below is the vendored storytold release and must equal the
# image tag and the version in catalog/craft/craft-manifest.yaml.
name: designcraft
version: 0.8.0
title: DesignCraft
blurb: Page layout and publishing tool that runs in your browser.
description: DesignCraft is a page layout and publishing application for magazines, brochures and similar documents, with threaded text frames, typography, images and PDF export. It runs entirely in the browser from a small web server on your appliance, so there is nothing to install on your devices. Your documents stay in your browser and export to your device; the app keeps nothing on the appliance, and only its preferences are remembered by the browser. It works best in a recent browser with WebGPU or WebGL2; the appliance cannot check this, so Homestead lists browser needs as advisories only. It is served over your local network.
category: productivity
icon: mdi:page-layout-body
services:
- name: designcraft
  image: homestead/craft-designcraft:0.8.0
  exposes: web
  # The image declares no VOLUME. nginx runs as the unprivileged nginx
  # user and writes only under /tmp (pid file and temporary paths), so
  # /tmp is the whole writable surface.
  data:
  - target: /tmp
    ephemeral: true
    sizemb: 16
    reason: nginx pid file and request temporary files; nothing to keep or back up.
requirements:
  memorymb: 64
  cpucount: 1
  architectures: [amd64, arm64]
exposure:
  package: designcraft
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: false
    warnings:
    - DesignCraft stores nothing on the appliance, so widening exposure would offer a public layout tool whose documents never reach your storage; it has no Nextcloud file hook, so documents stay in each visitor's browser. Keep it local.
browser:
- capability: webgpu
  reason: "DesignCraft renders with WebGPU where the browser has it and falls back to WebGL2 on its own; ?webgl forces WebGL2 and ?cpu the slower CPU canvas."
- capability: webgl2
  reason: "If WebGPU is missing DesignCraft uses WebGL2; a browser with neither gets an in-page message instead of the app."
- capability: secure-context
  reason: "WebGPU and the clipboard need a secure context (HTTPS); trust your Homestead root certificate on the device first."
- capability: clipboard
  reason: "Copy and paste with other applications uses the browser clipboard, which needs a secure context and the browser's permission."
- capability: browser-storage
  reason: "Preferences are kept in the browser's local storage, which the browser may clear; export documents to your device to keep them."
sso:
  class: unsupported
