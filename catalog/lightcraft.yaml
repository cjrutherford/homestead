# LightCraft (S251): a static craft package on the S249 shared shape
# (docs/architecture/STATIC_CRAFT_PACKAGES.md). The image is built on the
# appliance by the signed, verify-then-build craft operation (ADR-028); it
# is never pulled, so there is no registry reference and no catalog digest.
# The version below is the vendored storytold release and must equal the
# image tag and the version in catalog/craft/craft-manifest.yaml.
name: lightcraft
publish: path  # ADR-062: public path behind the shared Authentik gate; the LAN stays open
version: 0.8.0
title: LightCraft
blurb: Photo library and raw developer that runs in your browser.
description: LightCraft is a photo library and raw developer for importing photographs, developing raw files and exporting the results. It runs entirely in the browser from a small web server on your appliance, so there is nothing to install on your devices and your photos are never uploaded. Its library (catalog and imported photos) is kept in your browser's own site storage, which the browser may clear, so keep your original photos elsewhere and use File, Back Up Library; the app keeps nothing on the appliance. It needs a modern browser with WebGL2 and a secure context for browser storage and render workers, which your Homestead internal CA certificate provides once your device trusts the root. It is experimental and is served over your local network.
category: productivity
icon: mdi:camera-iris
services:
- name: lightcraft
  image: homestead/craft-lightcraft:0.8.0
  exposes: web
  # The image declares no VOLUME. nginx runs as the unprivileged nginx
  # user and writes only under /tmp (pid file and temporary paths), so
  # /tmp is the whole writable surface.
  data:
  - target: /tmp
    ephemeral: true
    sizemb: 16
    reason: nginx pid file and request temporary files; nothing to keep or back up.
requirements:
  memorymb: 64
  cpucount: 1
  architectures: [amd64, arm64]
# Served at /apps/lightcraft/ under the appliance's own names (ADR-045). The
# app loads its assets by relative paths, so the edge strips the path;
# the wrapper page and file path under it come from the daemon.
serve: path
strip_prefix: true
exposure:
  package: lightcraft
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: true
    warnings:
    - LightCraft stores nothing on the appliance (its library lives in each visitor's browser), so widening exposure would offer a public photo tool whose library never reaches your storage; it has no Nextcloud file hook, so documents stay in each visitor's browser. Keep it local.
    - If you publish it, its public path sits behind the Authentik gate, so only people granted this app and the owner can open it. Your local address stays open (ADR-062).
sso:
  class: unsupported
  # ADR-062: the app has no sign-in of its own. Published, its path is behind
  # the shared Authentik gate on the tunnel entry only; the local names stay
  # open (ADR-045). No identity header is passed on and nothing bypasses.
  forwardauth:
    service: lightcraft
