# Authentik identity provider (S201): the fourth curated app package.
# Curated first-party manifest — versions pin here, updates bump this file.
# Image tags follow the official 2026.8 compose (server, worker, postgres
# 16); digests stay out because multi-arch digests differ per platform
# while tags resolve correctly everywhere.
# Secrets (S266): the Postgres password and Authentik secret key are
# generated into the secret store at install and delivered to containers
# as 0600 files through Compose secrets (ADR-021), never environment values.
# Authentik reads file:// URIs for its settings; postgres reads *_FILE.
name: authentik
version: 2026.8.3
title: Authentik
blurb: Single sign-on for your services.
description: Authentik brings single sign-on and identity management to the
  home appliance with OAuth2, OIDC, SAML, and LDAP providers — one login
  for every service that supports it. Identity state lives in Postgres;
  file state stays small and backed up.
category: identity
icon: mdi:key
services:
- name: server
  image: ghcr.io/goauthentik/server:2026.8.3
  exposes: web
  command: [server]
  environment:
    AUTHENTIK_POSTGRESQL__HOST: postgresql
    AUTHENTIK_POSTGRESQL__USER: authentik
    AUTHENTIK_POSTGRESQL__NAME: authentik
    # Served at <server>/apps/auth/ (ADR-044): Authentik serves every
    # page, its API and the OIDC endpoints under this path. It needs the
    # leading and the trailing slash.
    AUTHENTIK_WEB__PATH: /apps/auth/
  # No image VOLUME; the official compose binds media and templates.
  # Authentik runs as uid 1000.
  data:
  - target: /media
    class: application
    subpath: media
    uid: 1000
    gid: 1000
  - target: /templates
    class: application
    subpath: custom-templates
    uid: 1000
    gid: 1000
- name: worker
  image: ghcr.io/goauthentik/server:2026.8.3
  exposes: ""
  command: [worker]
  environment:
    AUTHENTIK_POSTGRESQL__HOST: postgresql
    AUTHENTIK_POSTGRESQL__USER: authentik
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_WEB__PATH: /apps/auth/
  data:
  - target: /media
    class: application
    subpath: media
    uid: 1000
    gid: 1000
  - target: /certs
    class: application
    subpath: certs
    uid: 1000
    gid: 1000
  - target: /templates
    class: application
    subpath: custom-templates
    uid: 1000
    gid: 1000
- name: postgresql
  image: docker.io/library/postgres:16-alpine
  exposes: ""
  environment:
    POSTGRES_USER: authentik
    POSTGRES_DB: authentik
  # Image VOLUME: /var/lib/postgresql/data (alpine postgres uid 70, 0700).
  data:
  - target: /var/lib/postgresql/data
    class: application
    subpath: postgres
    database: true
    mode: "0700"
    uid: 70
    gid: 70
# Served at <server>/apps/auth/ (ADR-044). Authentik serves under the
# prefix itself (AUTHENTIK_WEB__PATH), so the edge keeps it.
serve: path
path: /apps/auth/
requirements:
  memorymb: 2048
  cpucount: 2
  architectures: [amd64, arm64]
  storage:
  - class: application
    minbytes: 2147483648
  ports: [9000]
exposure:
  package: authentik
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: true
    warnings:
    - Identity logins leave the LAN when widened; share deliberately.
backuppaths:
- config
sso:
  class: unsupported
database:
  service: postgresql
  kind: postgres
  database: authentik
  username: authentik
  passwordsecret: db_password
secrets:
- name: db_password
  consumers:
  - service: postgresql
    env: POSTGRES_PASSWORD_FILE
  - service: server
    env: AUTHENTIK_POSTGRESQL__PASSWORD
    uri: true
  - service: worker
    env: AUTHENTIK_POSTGRESQL__PASSWORD
    uri: true
- name: secret_key
  # Rotating the key would invalidate sessions and encrypted fields.
  immutable: true
  consumers:
  - service: server
    env: AUTHENTIK_SECRET_KEY
    uri: true
  - service: worker
    env: AUTHENTIK_SECRET_KEY
    uri: true
