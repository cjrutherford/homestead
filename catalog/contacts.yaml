# Contacts (S372, ADR-057): an Everything app. An address book that runs in the
# browser; its data lives on the appliance behind a small Homestead bridge that
# replaces the Puter cloud the app was written for. Each contact is one
# key-value record in the bridge's per-person storage. Curated first-party
# manifest. The image is built on the appliance from a pinned in-repo source
# archive by the signed, verify-then-build operation (ADR-028, ADR-057); it is
# never pulled, so there is no registry reference and no catalog digest. The
# version below is the package version and must equal the image tag.
name: contacts
publish: path  # ADR-061
version: 0.1.0
title: Contacts
blurb: A private address book with search and vCard import and export on your own server.
description: Contacts is a clean, fast address book. Keep people with several
  emails, phones, addresses and links, notes, birthdays and a photo, star
  favourites, search as you type, and import or export vCard (.vcf) files. It runs
  in the browser from a small web server on your appliance, and each person's
  contacts are kept on the appliance, private to that person. People sign in
  through Authentik; until the owner sets up sign-in the app serves nothing.
  Smart add (AI), adding birthdays to a calendar app and the Puter desktop
  integrations are not available on Homestead, and nothing you enter is sent to
  an AI service. The page needs your appliance to open; there is no offline use of
  the address book. It is served over your local network with a certificate from
  your Homestead internal CA.
category: productivity
icon: mdi:book-open-page-variant
services:
- name: contacts
  image: homestead/everything-contacts:0.1.0
  exposes: web
  containerport: 8081
  environment:
    # The bridge knows its own base path (no prefix is stripped) and the
    # origin its pages are served from, which it requires on every
    # state-changing request.
    HOMESTEAD_EVERYTHING_BASE_PATH: "{{route_path}}"
    HOMESTEAD_EVERYTHING_ORIGIN: "https://{{route_host}}"
    HOMESTEAD_EVERYTHING_OIDC_REDIRECT_URL: "{{route_url}}/_homestead/callback"
    # Until sign-in is applied the bridge starts and answers only that
    # sign-in is not set up (fail closed); it never serves data.
    HOMESTEAD_EVERYTHING_AWAIT_SIGNIN: "1"
    # Per-person and whole-app storage limits, in bytes.
    HOMESTEAD_EVERYTHING_QUOTA_PERSON_BYTES: "268435456"
    HOMESTEAD_EVERYTHING_QUOTA_APP_BYTES: "2147483648"
  # The image declares VOLUME /data (the bridge's SQLite database); the
  # bridge runs as uid/gid 65532.
  data:
  - target: /data
    class: application
    subpath: data
    uid: 65532
    gid: 65532
requirements:
  memorymb: 128
  cpucount: 1
  architectures: [amd64, arm64]
  storage:
  - class: application
    minbytes: 1073741824
# Served at <server>/apps/contacts/ (ADR-044). The bridge serves under the path
# itself, so the edge keeps it.
serve: path
exposure:
  package: contacts
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: true
    warnings:
    - Your address book leaves the LAN when widened; expose only behind HTTPS with a certificate you trust, and only to people who have an Authentik account.
backuppaths:
- data
database:
  service: contacts
  kind: sqlite
  path: data/bridge.db
sso:
  class: recommended
  protocols: [oidc]
  # Sign-in through Authentik (S368, ADR-053, ADR-057). The bridge is its own
  # OIDC client: it needs the issuer, its client id and a client secret file,
  # all handed over by the normal sign-in plan. People who are not granted
  # the app in Homestead cannot sign in (closed by default, ADR-043).
  #
  # The app is served by path, so the origins sign-in is planned for already
  # end in /apps/contacts (ADR-044): the redirect and sign-in paths below are
  # relative to the app, matching the bridge's own /_homestead/ routes.
  oidc:
    adapter: env-oidc
    service: contacts
    env:
      redirectpaths: ["/_homestead/callback"]
      signinpath: /_homestead/login
      secret: oidc_client_secret
      # The bridge has no password sign-in of its own: once sign-in is on it
      # is the only way in.
      exclusive: true
      # The bridge trusts exactly the bundle it is given; the combined
      # bundle keeps a public issuer (Let's Encrypt) working too.
      trust: HOMESTEAD_EVERYTHING_OIDC_CA_FILE
      trustbundle: combined
      set:
        HOMESTEAD_EVERYTHING_OIDC_ISSUER: "{{issuer}}"
        HOMESTEAD_EVERYTHING_OIDC_CLIENT_ID: "{{client_id}}"
secrets:
- name: oidc_client_secret
  # Authentik's client secret for Contacts; Homestead generates it, hands it to
  # Authentik, and gives the bridge the file (never an environment value).
  consumers:
  - service: contacts
    env: HOMESTEAD_EVERYTHING_OIDC_CLIENT_SECRET_FILE
integrations:
- kind: identity
  target: authentik
  note: People sign in with Authentik once sign-in is applied on the app's page; the app serves nothing before that.
