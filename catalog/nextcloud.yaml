# Nextcloud files and collaboration (S170): the second curated app package.
# Curated first-party manifest — versions pin here, updates bump this file.
# SQLite carries the database by default (single-user scale); larger
# deployments graduate to external databases in later slices.
name: nextcloud
version: 35.0.1
title: Nextcloud
blurb: Files, calendar, and contacts you host.
description: Nextcloud keeps files in sync across devices with calendar
  and contacts alongside, all on the home appliance. User files live on
  bulk storage; configuration and the embedded database stay small and
  backed up.
category: files
icon: mdi:cloud
services:
- name: nextcloud
  image: nextcloud:35.0.1-apache
  exposes: web
  # The edge route hostname is a trusted domain from the first install
  # (S254): the daemon's craft file link and every browser reach
  # Nextcloud through it, and Nextcloud refuses an unlisted Host. The
  # image applies this once, when it first installs; an existing install
  # adds the name with occ (docs/architecture/CRAFT_FILE_PROXY.md).
  environment:
    NEXTCLOUD_TRUSTED_DOMAINS: "{{route_host}}"
  # Image VOLUME: /var/www/html (code, config, apps). User files and
  # the default SQLite database live in its data/ directory, mounted
  # nested on bulk storage (not flagged `database`: it is mostly user
  # files). The image runs as www-data (33); the nested mountpoint stub
  # is provisioned with the same owner.
  data:
  - target: /var/www/html
    class: application
    subpath: html
    uid: 33
    gid: 33
  - target: /var/www/html/data
    class: bulk
    subpath: data
    uid: 33
    gid: 33
requirements:
  memorymb: 1024
  cpucount: 2
  architectures: [amd64, arm64]
  storage:
  - class: application
    minbytes: 2147483648
  - class: bulk
    minbytes: 53687091200
  # No host port: the container publishes none (the edge serves it), so
  # declaring its port 80 refused every install once Caddy held 80. The
  # container port is entered in the install request (the dashboard
  # defaults it to 80).
exposure:
  package: nextcloud
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: true
    warnings:
    - Files leave the LAN when widened; share deliberately.
backuppaths:
- config
sso:
  class: optional
  protocols: [oidc, saml, ldap]
  # App sign-in through Authentik (S298): the user_oidc app, set up with occ.
  oidc:
    adapter: nextcloud-user-oidc
    service: nextcloud
