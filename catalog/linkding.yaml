# Linkding bookmark manager (S349): the fifth Wave 1 package.
# Curated first-party manifest — versions pin here, updates bump this file.
# One container with SQLite. Linkding has no ENTRYPOINT, only the CMD
# ./bootstrap.sh, so that script is what the secret supervisor execs: the
# image's startup is unchanged, and the superuser password arrives as a
# 0600 file that the supervisor exports (ADR-052). The initial superuser
# is created once; changing the secret later does not reset the account.
# The Authentik client secret (S409) rides the same supervisor: Linkding
# reads OIDC_RP_CLIENT_SECRET only as plaintext, so the supervisor exports
# it from a 0600 file and it never reaches Compose, argv, or logs.
name: linkding
version: 1.47.0
title: Linkding
blurb: Your bookmarks, searchable and yours.
description: Linkding saves bookmarks with tags, notes, and a full-text
  search, and archives pages so a link keeps working after the site
  changes. A browser extension posts to it, the interface stays quick,
  and everything lives in one SQLite database on application storage.
category: bookmarks
icon: mdi:bookmark-multiple
services:
- name: linkding
  image: docker.io/sissbruecker/linkding:1.47.0
  publisher: upstream
  exposes: web
  containerport: 9090
  # The image has no ENTRYPOINT; ./bootstrap.sh is its CMD (runs
  # migrations, creates the initial superuser, starts uwsgi). Naming it
  # as the entrypoint lets the supervisor export the password first and
  # then exec exactly that script.
  entrypoint: ["./bootstrap.sh"]
  environment:
    # Behind the proxy the browser origin is HTTPS even though uwsgi is
    # plain HTTP; without this, logins and saves fail CSRF verification.
    # Linkding splits the value on commas: the local address and the
    # address the app is published on (the same address until it has a
    # public name of its own, S407), so both origins can sign in (S409).
    LD_CSRF_TRUSTED_ORIGINS: "{{route_url}},{{app_url}}"
    # Creates the first superuser once. The password comes from the
    # secret store through the supervisor, never from this block.
    LD_SUPERUSER_NAME: admin
  # No image VOLUME. The data directory holds the SQLite database, the
  # generated secret key, favicons, previews, and page archives; the
  # image's bootstrap script hands it to www-data (uid/gid 33).
  data:
  - target: /etc/linkding/data
    class: application
    subpath: data
    uid: 33
    gid: 33
requirements:
  memorymb: 256
  cpucount: 1
  architectures: [amd64, arm64]
  storage:
  - class: application
    minbytes: 1073741824
  # Linkding listens on 9090; routes proxy to it and no host port is
  # published by default.
exposure:
  package: linkding
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: true
    warnings:
    - Bookmarks, notes, and archived pages leave the LAN when widened; expose only behind HTTPS with a certificate you trust.
backuppaths:
- data
sso:
  class: optional
  protocols: [oidc]
  # App sign-in through Authentik (S409): mozilla-django-oidc, set by
  # environment alone. It has no discovery, so each endpoint is built
  # from Authentik's address. The local admin keeps working: the login
  # form stays and OIDC adds a button. Linkding has no group claim, so
  # every Authentik person becomes an ordinary user (see DEFERRED).
  oidc:
    adapter: env-oidc
    service: linkding
    env:
      redirectpaths: ["/oidc/callback/"]
      signinpath: /oidc/authenticate/
      secret: oidc_client_secret
      # requests honours REQUESTS_CA_BUNDLE as its whole trust store, so
      # it is set only for the appliance's own issuer (S405), and then
      # points at the host's public CAs plus the appliance root, so
      # Linkding's fetches of public pages keep working (S410).
      trust: REQUESTS_CA_BUNDLE
      trustbundle: combined
      set:
        LD_ENABLE_OIDC: "True"
        OIDC_OP_AUTHORIZATION_ENDPOINT: "{{authentik_base}}/application/o/authorize/"
        OIDC_OP_TOKEN_ENDPOINT: "{{authentik_base}}/application/o/token/"
        OIDC_OP_USER_ENDPOINT: "{{authentik_base}}/application/o/userinfo/"
        OIDC_OP_JWKS_ENDPOINT: "{{issuer}}jwks/"
        OIDC_RP_CLIENT_ID: "{{client_id}}"
        # Authentik signs ID tokens with RS256 (Linkding's default too).
        OIDC_RP_SIGN_ALGO: RS256
        # The username Linkding creates; existing accounts still match
        # by email.
        OIDC_USERNAME_CLAIM: preferred_username
secrets:
- name: superuser_password
  # The initial superuser is created once from this value; rotating it
  # later does not reset an existing account (use the app or
  # `manage.py changepassword` inside the container). Revealable (S458):
  # the owner needs it to reach the local administrator account, which
  # manages users and the site's settings; Authentik people are ordinary
  # users and cannot.
  immutable: true
  reveal: true
  consumers:
  - service: linkding
    env: LD_SUPERUSER_PASSWORD_FILE
    export: true
- name: oidc_client_secret
  # Authentik's client secret for Linkding; Homestead generates it, hands
  # it to Authentik, and the supervisor exports it as OIDC_RP_CLIENT_SECRET.
  consumers:
  - service: linkding
    env: OIDC_RP_CLIENT_SECRET_FILE
    export: true
integrations:
- kind: identity
  target: authentik
  note: People sign in with Authentik once sign-in is applied on the app's page; OIDC matches existing accounts by email, so give the admin account one first. The local administrator stays available.
