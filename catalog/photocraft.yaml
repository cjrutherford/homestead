# PhotoCraft (S251): a static craft package on the S249 shared shape
# (docs/architecture/STATIC_CRAFT_PACKAGES.md). The image is built on the
# appliance by the signed, verify-then-build craft operation (ADR-028); it
# is never pulled, so there is no registry reference and no catalog digest.
# The version below is the vendored storytold release and must equal the
# image tag and the version in catalog/craft/craft-manifest.yaml.
name: photocraft
publish: never  # ADR-061
version: 0.9.0
title: PhotoCraft
blurb: Photo editor that runs in your browser.
description: PhotoCraft is a photo editor with layers, adjustments, filters, retouching and export to common image formats. It runs entirely in the browser from a small web server on your appliance, so there is nothing to install on your devices and your photos are never uploaded. Images stay in your browser and download to your device; the app keeps nothing on the appliance. It needs a modern browser with WebGPU or WebGL2 and a secure context, which your Homestead internal CA certificate provides once your device trusts the root; without WebGPU it falls back to WebGL2 on its own. It is served over your local network.
category: productivity
icon: mdi:image-edit-outline
services:
- name: photocraft
  image: homestead/craft-photocraft:0.9.0
  exposes: web
  # The image declares no VOLUME. nginx runs as the unprivileged nginx
  # user and writes only under /tmp (pid file and temporary paths), so
  # /tmp is the whole writable surface.
  data:
  - target: /tmp
    ephemeral: true
    sizemb: 16
    reason: nginx pid file and request temporary files; nothing to keep or back up.
requirements:
  memorymb: 64
  cpucount: 1
  architectures: [amd64, arm64]
# Served at /apps/photocraft/ under the appliance's own names (ADR-045). The
# app loads its assets by relative paths, so the edge strips the path;
# the wrapper page and file path under it come from the daemon.
serve: path
strip_prefix: true
exposure:
  package: photocraft
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: false
    warnings:
    - PhotoCraft stores nothing on the appliance, so widening exposure would offer a public photo editor whose images never reach your storage; it has no Nextcloud file hook, so documents stay in each visitor's browser. Keep it local.
sso:
  class: unsupported
