# PdfCraft (S250): a static craft package on the S249 shared shape
# (docs/architecture/STATIC_CRAFT_PACKAGES.md). The image is built on the
# appliance by the signed, verify-then-build craft operation (ADR-028); it
# is never pulled, so there is no registry reference and no catalog digest.
# The version below is the vendored storytold release and must equal the
# image tag and the version in catalog/craft/craft-manifest.yaml.
name: pdfcraft
version: 0.8.0
title: PdfCraft
blurb: PDF workbench that runs in your browser.
description: PdfCraft is a PDF workbench that reads, organizes, combines, splits and secures PDF files. It runs entirely in the browser from a small web server on your appliance, so there is nothing to install on your devices and your documents are never uploaded. Files stay in your browser and download to your device; the app keeps nothing on the appliance. It is served over your local network with a certificate from your Homestead internal CA.
category: productivity
icon: mdi:file-pdf-box
services:
- name: pdfcraft
  image: homestead/craft-pdfcraft:0.8.0
  exposes: web
  # The image declares no VOLUME. nginx runs as the unprivileged nginx
  # user and writes only under /tmp (pid file and temporary paths), so
  # /tmp is the whole writable surface.
  data:
  - target: /tmp
    ephemeral: true
    sizemb: 16
    reason: nginx pid file and request temporary files; nothing to keep or back up.
requirements:
  memorymb: 64
  cpucount: 1
  architectures: [amd64, arm64]
exposure:
  package: pdfcraft
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: false
    warnings:
    - PdfCraft stores nothing on the appliance, so widening exposure would offer a public PDF tool whose documents never reach your storage. With Nextcloud file storage linked, this host also forwards its document path (/_homestead/files/) to your appliance, which reads and writes your Nextcloud on the browser's behalf; it needs a Homestead operator session opened from the dashboard, but widening exposure puts the host, that path and your document transfers beyond the LAN. Keep it local.
sso:
  class: unsupported
