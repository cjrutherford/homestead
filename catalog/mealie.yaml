# Mealie recipe manager (S350): the sixth Wave 1 package.
# Curated first-party manifest — versions pin here, updates bump this file.
# One GHCR container with SQLite on application storage. Mealie seeds a
# default administrator (changeme@example.com / MyPassword) on first
# start, so the owner signs in with the documented credentials and
# changes them, then creates household accounts; signups stay closed.
# No secret is declared and the image's own entrypoint runs unchanged.
name: mealie
version: 3.29.0
title: Mealie
blurb: Recipes, meal plans, and one shopping list.
description: Mealie keeps family recipes with photos and steps, builds a
  weekly meal plan, and turns it into a shopping list you can share. It
  imports recipes from a URL, scales ingredients, and stores everything in
  one SQLite database on application storage.
category: recipes
icon: mdi:silverware-fork-knife
services:
- name: mealie
  image: ghcr.io/mealie-recipes/mealie:v3.29.0
  exposes: web
  containerport: 9000
  environment:
    # Links in the app and its exports use the routed HTTPS host; the
    # variable is dropped when no route is assigned.
    BASE_URL: "https://{{route_host}}"
    DB_ENGINE: sqlite
    # The seeded administrator signs in once and changes the password;
    # further household members are created from the admin UI, so public
    # signup stays off.
    ALLOW_SIGNUP: "false"
  # Image VOLUME: /app/data (SQLite database, generated secrets,
  # uploaded recipe images, and app-created backups). The image runs as
  # root and keeps the volume root-owned.
  data:
  - target: /app/data
    class: application
    subpath: data
requirements:
  memorymb: 512
  cpucount: 1
  architectures: [amd64, arm64]
  storage:
  - class: application
    minbytes: 2147483648
  # Mealie listens on 9000; routes proxy to it and no host port is
  # published by default.
exposure:
  package: mealie
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: true
    warnings:
    - Recipes, meal plans, and shopping lists leave the LAN when widened; expose only behind HTTPS with a certificate you trust.
backuppaths:
- data
sso:
  class: optional
  protocols: [oidc]
integrations:
- kind: identity
  target: authentik
  note: Sign in with Authentik once its OIDC client is configured; local sign-in stays available.
