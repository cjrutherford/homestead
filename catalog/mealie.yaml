# Mealie recipe manager (S350): the sixth Wave 1 package.
# Curated first-party manifest — versions pin here, updates bump this file.
# One GHCR container with SQLite on application storage. Mealie seeds a
# default administrator (changeme@example.com / MyPassword) on first
# start, so the owner signs in with the documented credentials and
# changes them, then creates household accounts; signups stay closed.
# The only declared secret is the Authentik client secret (S403); the
# image's own entrypoint runs unchanged, Mealie reads the secret from a
# file (OIDC_CLIENT_SECRET_FILE).
name: mealie
version: 3.29.0
title: Mealie
blurb: Recipes, meal plans, and one shopping list.
description: Mealie keeps family recipes with photos and steps, builds a
  weekly meal plan, and turns it into a shopping list you can share. It
  imports recipes from a URL, scales ingredients, and stores everything in
  one SQLite database on application storage.
category: recipes
icon: mdi:silverware-fork-knife
services:
- name: mealie
  image: ghcr.io/mealie-recipes/mealie:v3.29.0
  exposes: web
  containerport: 9000
  environment:
    # Links in the app and its exports use the routed HTTPS host; the
    # variable is dropped when no route is assigned.
    BASE_URL: "https://{{route_host}}"
    DB_ENGINE: sqlite
    # The seeded administrator signs in once and changes the password;
    # further household members are created from the admin UI, so public
    # signup stays off.
    ALLOW_SIGNUP: "false"
  # Image VOLUME: /app/data (SQLite database, generated secrets,
  # uploaded recipe images, and app-created backups). run.sh starts as
  # root, chowns /app to PUID 911 and re-execs as that user before it
  # reads the *_FILE secrets, so the volume and the sign-in secret file
  # are owned by 911:911.
  data:
  - target: /app/data
    class: application
    subpath: data
    uid: 911
    gid: 911
requirements:
  memorymb: 512
  cpucount: 1
  architectures: [amd64, arm64]
  storage:
  - class: application
    minbytes: 2147483648
  # Mealie listens on 9000; routes proxy to it and no host port is
  # published by default.
exposure:
  package: mealie
  endpoints:
  - endpoint: web
    recommended: local
    allowwider: true
    warnings:
    - Recipes, meal plans, and shopping lists leave the LAN when widened; expose only behind HTTPS with a certificate you trust.
backuppaths:
- data
sso:
  class: optional
  protocols: [oidc]
  # App sign-in through Authentik (S403): Mealie's built-in OIDC, set by
  # environment alone. Authentik groups gate access (signup is on only
  # for people Authentik lets in); the seeded local administrator keeps
  # working because there is no auto-redirect.
  oidc:
    adapter: env-oidc
    service: mealie
    env:
      redirectpaths: ["/login", "/login?direct=1"]
      signinpath: /login
      secret: oidc_client_secret
      trust: OIDC_TLS_CACERTFILE
      set:
        OIDC_AUTH_ENABLED: "true"
        OIDC_CONFIGURATION_URL: "{{issuer}}.well-known/openid-configuration"
        OIDC_CLIENT_ID: "{{client_id}}"
        OIDC_PROVIDER_NAME: Authentik
        OIDC_SIGNUP_ENABLED: "true"
        OIDC_AUTO_REDIRECT: "false"
        OIDC_REMEMBER_ME: "true"
        OIDC_GROUPS_CLAIM: groups
        OIDC_ADMIN_GROUP: "{{admin_group}}"
        OIDC_USER_GROUP: "{{user_group}}"
secrets:
- name: oidc_client_secret
  # Authentik's client secret for Mealie; Homestead generates it, hands it
  # to Authentik, and gives Mealie the file.
  consumers:
  - service: mealie
    env: OIDC_CLIENT_SECRET_FILE
integrations:
- kind: identity
  target: authentik
  note: People sign in with Authentik once sign-in is applied on the app's page; the local administrator stays available.
